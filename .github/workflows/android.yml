# Tools の Android アプリ（APK）をビルドする
#
# - どのブランチでも：Actions の実行結果に「tools-apk」として APK を置く
# - main に入ったとき：リリース「android-latest」の APK を差し替える
#   （スマホで https://github.com/<owner>/<repo>/releases/tag/android-latest を開けばダウンロードできる）
#
# 署名：リポジトリの Secrets に ANDROID_KEYSTORE_BASE64 などがあればその鍵で署名した release 版、
#       無ければ debug 版を作る（debug 版は毎回鍵が変わるので、更新のたびにアンインストールが必要）。
name: Android APK

on:
  push:
    paths:
      - 'app/**'
      - 'music/**'
      - 'shared/**'
      - 'convrt/**'
      - 'slides/**'
      - 'checklist/**'
      - 'guitar/**'
      - 'change-seats/**'
      - 'makingsite/**'
      - 'sheetbase/**'
      - '*.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Web のファイルをアプリに入れる
        working-directory: app
        run: |
          npm ci
          npm run sync

      - name: 署名の鍵を用意
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tools.keystore"
            echo "file=$RUNNER_TEMP/tools.keystore" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: APK をビルド
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.variant }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tools.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/tools.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tools-apk
          path: ${{ runner.temp }}/tools.apk

      - name: リリース「android-latest」を更新（main のみ）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest "$RUNNER_TEMP/tools.apk#Tools.apk" \
            --target "$GITHUB_SHA" \
            --title "Tools（Android アプリ）" \
            --notes "main の最新（${GITHUB_SHA::7}、${{ steps.keystore.outputs.variant }} 版）。スマホでこのページを開き、Tools.apk をダウンロードしてインストールしてください。" \
            --prerelease
