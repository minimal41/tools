<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>チェックリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Kaku+Gothic+Antique:wght@700;900&display=swap">
<style>
/* Layout: 左に自分のリスト一覧、右に開いているリスト。スマホでは縦に積む。 */
:root {
  --bg: #f3f5f4;
  --panel: #ffffff;
  --ink: #1d2a2a;
  --muted: #637170;
  --line: #dbe2e0;
  --accent: #1f7a6c;
  --accent-soft: #e2f1ee;
  --danger: #b23b3b;
  --font-display: "Zen Kaku Gothic Antique", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121817; --panel: #1a2221; --ink: #e4ecea; --muted: #8fa09d; --line: #2b3735;
    --accent: #4fc0ab; --accent-soft: #1d3330; --danger: #e07272; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121817; --panel: #1a2221; --ink: #e4ecea; --muted: #8fa09d; --line: #2b3735;
  --accent: #4fc0ab; --accent-soft: #1d3330; --danger: #e07272; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; padding-block: 28px 48px; display: flex; flex-direction: column; gap: 20px; }
.home { font-size: .8rem; color: var(--muted); text-decoration: none; }
.home:hover { color: var(--ink); }
.acct { font-size: 12px; color: var(--muted); }
.note { font-size: .8rem; color: var(--muted); margin: 0; }
.note a { color: var(--accent); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; margin: 0; letter-spacing: .02em; }
.status { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-s="saved"] .dot { background: var(--accent); }
.status[data-s="saving"] .dot { background: #d9a43a; }
.status[data-s="error"] .dot { background: var(--danger); }
.grid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 680px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.lists { display: flex; flex-direction: column; gap: 4px; }
.lists-head { font-size: .72rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; padding: 0 10px 6px; }
.list-btn {
  all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center;
  padding: 9px 12px; border-radius: 8px; font-weight: 500; min-width: 0;
}
.list-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-btn .count { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.list-btn:hover { background: var(--accent-soft); }
.list-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.list-btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.new-list { all: unset; cursor: pointer; padding: 9px 12px; color: var(--accent); font-weight: 700; border-radius: 8px; }
.new-list:hover { background: var(--accent-soft); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.title-row { display: flex; gap: 10px; align-items: center; }
.title-input {
  flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem;
  border: 0; background: transparent; color: var(--ink); padding: 4px 0; border-bottom: 1px solid transparent;
}
.title-input:hover, .title-input:focus { border-bottom-color: var(--line); outline: none; }
.progress { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px;
}
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: var(--panel); cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
.ghost { font: inherit; font-size: .8rem; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.ghost:hover { color: var(--ink); background: var(--bg); }
.ghost.danger:hover { color: var(--danger); }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.items li { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
ul.items li:last-child { border-bottom: 0; }
ul.items input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; cursor: pointer; }
ul.items .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
ul.items li.done .text { color: var(--muted); text-decoration: line-through; }
.handle {
  all: unset; display: inline-flex; align-items: center; cursor: grab; touch-action: none; flex: none; color: var(--muted); font-size: .9rem;
  letter-spacing: -2px; padding: 4px 6px; border-radius: 6px; line-height: 1; user-select: none;
}
.handle:hover { color: var(--ink); background: var(--bg); }
.handle:active { cursor: grabbing; }
.nav-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
.nav-row .list-btn { flex: 1; }
.nav-row .handle { opacity: 0; }
.nav-row:hover .handle, .nav-row .handle:focus-visible { opacity: 1; }
@media (hover: none) { .nav-row .handle { opacity: 1; } }
.dragging { opacity: .55; background: var(--accent-soft); border-radius: 8px; }
body.sorting, body.sorting * { cursor: grabbing !important; user-select: none; }
ul.items .del { opacity: 0; }
ul.items li:hover .del, ul.items .del:focus-visible { opacity: 1; }
@media (hover: none) { ul.items .del { opacity: 1; } }
.foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); text-align: center; padding: 28px 12px; }
.empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }
.confirm { display: flex; gap: 8px; align-items: center; font-size: .85rem; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../index.html">← Tools</a>
  <header>
    <h1>チェックリスト</h1>
    <div class="acct" data-tools-account></div>
    <div class="status" id="status" data-s="idle"><span class="dot"></span><span id="status-text">読み込み中…</span></div>
  </header>
  <p class="note" id="where" hidden></p>
  <div class="grid">
    <nav class="lists" aria-label="リスト一覧">
      <div class="lists-head">リスト</div>
      <div id="list-nav"></div>
      <button class="new-list" id="new-list" type="button">＋ 新しいリスト</button>
    </nav>
    <main class="card" id="main">
      <div class="empty"><strong>リストを読み込んでいます</strong>ログインしていると、作ったリストはアカウントに保存され、どの端末からでも開けます。</div>
    </main>
  </div>
</div>

<script type="module" src="../shared/account-badge.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
