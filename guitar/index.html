<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ギター譜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Kaku+Gothic+Antique:wght@700;900&display=swap">
<style>
/* 曲の一覧：保存されている曲をカードで並べ、押すと曲ごとのページ（edit.html?id=…）を開く */
:root {
  --bg: #f4f2ee;
  --panel: #ffffff;
  --paper: #fffdf9;
  --ink: #22201c;
  --muted: #6f6a62;
  --line: #ddd8cf;
  --accent: #b5532a;
  --accent-soft: #f6e6dc;
  --danger: #b23b3b;
  --font-display: "Zen Kaku Gothic Antique", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #1f1d1a; --paper: #1b1a17; --ink: #ece7de; --muted: #a29b90; --line: #34312c;
    --accent: #e8875a; --accent-soft: #3a2a21; --danger: #e07272; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #1f1d1a; --paper: #1b1a17; --ink: #ece7de; --muted: #a29b90; --line: #34312c;
  --accent: #e8875a; --accent-soft: #3a2a21; --danger: #e07272; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 22px 48px; display: flex; flex-direction: column; gap: 16px; }
.home { font-size: .8rem; color: var(--muted); text-decoration: none; }
.home:hover { color: var(--ink); }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
.lead { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
.acct { font-size: 12px; color: var(--muted); }
.status { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-s="saved"] .dot { background: #3f8f5a; }
.status[data-s="error"] .dot { background: var(--danger); }
.note { font-size: .78rem; color: var(--muted); margin: 0; }
.note a { color: var(--accent); }

.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.bar .search { flex: 1 1 200px; min-width: 0; }
.in { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
select.in { width: auto; min-width: 10.5em; }
.btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 4px 10px; font-size: .8rem; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column;
  min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(0, 0, 0, .06); }
.card a.open { color: inherit; text-decoration: none; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.card .t { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; overflow-wrap: anywhere; }
.card a.open:hover .t { color: var(--accent); }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .76rem; color: var(--muted); }
.card .meta b { color: var(--ink); font-weight: 700; }
.card .chords { font-family: var(--font-num); font-size: .78rem; color: var(--ink); background: var(--bg); border-radius: 6px; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .chords.none { color: var(--muted); font-family: var(--font-body); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 8px 12px 8px 16px; }
.card .when { font-size: .72rem; color: var(--muted); }
.card .acts { display: flex; gap: 4px; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 40px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 12px; }
dialog form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field > span { font-size: .7rem; color: var(--muted); letter-spacing: .06em; font-weight: 700; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid3 .in { width: 100%; }
.hint { font-size: .74rem; color: var(--muted); margin: 0; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../index.html">← Tools</a>
  <header class="top">
    <div>
      <h1>ギター譜</h1>
      <p class="lead">TAB 譜を打ったり、コードとリズムを選んで押さえ方つきの譜面を作れます。</p>
    </div>
    <div class="acct" data-tools-account></div>
    <div class="status" id="status" data-s="idle"><span class="dot"></span><span id="status-text">読み込み中…</span></div>
  </header>
  <p class="note" id="where" hidden></p>

  <div class="bar">
    <button class="btn primary" id="new-song" type="button">＋ 新しい曲</button>
    <input class="in search" id="search" type="search" placeholder="曲名で探す" aria-label="曲名で探す">
    <select class="in" id="sort" aria-label="並び順">
      <option value="updated">更新が新しい順</option>
      <option value="created">作った順</option>
      <option value="title">曲名順</option>
    </select>
  </div>

  <ul class="list" id="list" aria-label="保存されている曲"></ul>
  <div class="empty" id="empty" hidden></div>
</div>

<dialog id="new-dialog">
  <h2>新しい曲</h2>
  <form method="dialog" id="new-form">
    <label class="field"><span>タイトル</span><input class="in" name="title" type="text" maxlength="80" value="新しい曲"></label>
    <div class="grid3">
      <label class="field"><span>カポ</span><select class="in" name="capo" id="new-capo"></select></label>
      <label class="field"><span>拍子</span>
        <select class="in" name="meter"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option></select>
      </label>
      <label class="field"><span>テンポ ♩=</span><input class="in" name="tempo" type="number" min="30" max="300" value="90"></label>
    </div>
    <p class="hint">カポの位置はあとからでも変えられます。TAB の数字はカポからのフレット数（カポ = 0）で書きます。</p>
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate type="submit">やめる</button>
      <button class="btn primary" value="ok" type="submit">作って開く</button>
    </div>
  </form>
</dialog>

<script type="module" src="../shared/account-badge.js"></script>
<script type="module" src="list.js"></script>
</body>
</html>
