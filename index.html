<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1b;
    --sub: #6e6c67;
    --faint: #9c9a94;
    --line: #e7e5e0;
    --paper: #f7f6f3;
    --accent: #c8462c;
    --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    flex: 1 0 auto;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 96px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .menu {
    list-style: none;
    border-top: 1px solid var(--ink);
  }

  .menu a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
  }

  .menu a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .menu .text { flex: 1; min-width: 0; }

  .menu .name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    transition: color 0.15s;
  }

  .menu .desc {
    font-size: 13px;
    color: var(--sub);
  }

  .menu .arrow {
    color: var(--faint);
    transition: color 0.15s, transform 0.15s;
  }

  .menu a:hover .name,
  .menu a:hover .arrow { color: var(--accent); }
  .menu a:hover .arrow { transform: translateX(3px); }


  /* ---------- アカウント ---------- */
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .head h1 { margin-bottom: 0; }

  .account { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .account .who { color: var(--sub); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    display: inline-block;
    text-decoration: none;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 3px;
    padding: 6px 14px;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notice {
    font-size: 12.5px;
    color: var(--sub);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 20px;
  }
  .notice[hidden] { display: none; }

  /* Footer：画面幅いっぱいの淡い帯。ページが短くても画面の下端に置く */
  .site-footer {
    flex-shrink: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }

  .footer-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    color: var(--faint);
  }

  /* 大きさ・位置は席替えページ（change-seats）と同じ：中央・15px */
  .copyright {
    font-size: 15px;
    color: var(--ink);
    opacity: 0.8;
    letter-spacing: 0.02em;
  }

  @media (max-width: 600px) {
    .container { padding-top: 28px; }
    .menu a { padding: 18px 0; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="head">
    <h1>Tools</h1>
    <div class="account" id="account">
      <span class="who" id="accountWho"></span>
      <a class="btn" id="loginBtn" href="login.html" hidden>ログイン</a>
      <a class="btn primary" id="signupBtn" href="signup.html" hidden>新規登録</a>
      <button type="button" class="btn" id="logoutBtn" hidden>ログアウト</button>
    </div>
  </header>
  <p class="notice" id="accountNotice" hidden></p>
  <ul class="menu">
    <li>
      <a href="convrt/index.html">
        <div class="text">
          <div class="name">Convrt</div>
          <div class="desc">画像・PDF・EPUB・音声の変換</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="slides/index.html">
        <div class="text">
          <div class="name">スライド</div>
          <div class="desc">発表用のスライドを作成し、そのまま発表・PDF で保存</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="change-seats/index.html">
        <div class="text">
          <div class="name">席替え</div>
          <div class="desc">名簿から座席表を作成し、PDF・Excel で保存</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="makingsite/index.html">
        <div class="text">
          <div class="name">Making Site</div>
          <div class="desc">パーツを組み立ててホームページを作成し、HTML で保存</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="sheetbase/index.html">
        <div class="text">
          <div class="name">Sheetbase</div>
          <div class="desc">Google スプレッドシートをデータベースにするサーバー</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <small class="copyright">© 2026 TEAM-Minimal</small>
  </div>
</footer>


<script type="module">
import * as account from './shared/account.js';

window.__toolsAccountLoaded = true;

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

/* 以前のリンク（index.html?account=login&next=…）で来たときは、ログイン・新規登録のページへ送る */
const requested = params.get('account');
if (requested === 'login' || requested === 'signup') {
  const next = params.get('next');
  location.replace((requested === 'signup' ? 'signup.html' : 'login.html') + (next ? '?next=' + encodeURIComponent(next) : ''));
}

if (!account.isConfigured) {
  $('accountNotice').hidden = false;
  $('accountNotice').textContent = 'アカウント機能を使うには、管理者が shared/config.js に Firebase の設定を書き込む必要があります。';
}

$('logoutBtn').addEventListener('click', () => account.logOut());

account.onUserChanged((user) => {
  $('loginBtn').hidden = !!user;
  $('signupBtn').hidden = !!user;
  $('logoutBtn').hidden = !user;
  $('accountWho').textContent = user ? (user.displayName || user.email) : '';
  $('accountWho').title = user ? user.email : '';
});
</script>

<script>
/* アカウント機能（shared/account.js）が読み込めなかったときは、ボタンが出ないままになるので案内を出す */
addEventListener('load', function () {
  setTimeout(function () {
    if (window.__toolsAccountLoaded) return;
    var n = document.getElementById('accountNotice');
    n.hidden = false;
    n.textContent = 'アカウント機能を読み込めませんでした。通信状況を確認するか、管理者は shared/config.js（「export const firebaseConfig」になっているか）を確認してください。';
  }, 3000);
});
</script>
</body>
</html>
