<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1b;
    --sub: #6e6c67;
    --faint: #9c9a94;
    --line: #e7e5e0;
    --paper: #f7f6f3;
    --accent: #c8462c;
    --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    flex: 1 0 auto;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 96px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .menu {
    list-style: none;
    border-top: 1px solid var(--ink);
  }

  .menu a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
  }

  .menu a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .menu .text { flex: 1; min-width: 0; }

  .menu .name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    transition: color 0.15s;
  }

  .menu .desc {
    font-size: 13px;
    color: var(--sub);
  }

  .menu .arrow {
    color: var(--faint);
    transition: color 0.15s, transform 0.15s;
  }

  .menu a:hover .name,
  .menu a:hover .arrow { color: var(--accent); }
  .menu a:hover .arrow { transform: translateX(3px); }

  /* Footer：画面幅いっぱいの淡い帯。ページが短くても画面の下端に置く */
  .site-footer {
    flex-shrink: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }

  .footer-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px 24px;
    font-size: 12px;
    color: var(--faint);
  }

  .copyright {
    color: var(--sub);
    letter-spacing: 0.02em;
  }

  @media (max-width: 600px) {
    .container { padding-top: 28px; }
    .menu a { padding: 18px 0; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Tools</h1>
  <ul class="menu">
    <li>
      <a href="convrt/index.html">
        <div class="text">
          <div class="name">Convrt</div>
          <div class="desc">画像・PDF・EPUB・音声の変換</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="change-seats/index.html">
        <div class="text">
          <div class="name">席替え</div>
          <div class="desc">名簿から座席表を作成し、PDF・Excel で保存</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <small class="copyright">© 2026 TEAM-Minimal</small>
  </div>
</footer>
</body>
</html>
